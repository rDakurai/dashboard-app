<table class="table table-striped table-sm">
    <thead>
        <tr>
            <th scope="col">#</th>
            <th scope="col">Nombre</th>
            <th scope="col">Email</th>
        </tr>
    </thead>
    <tbody>
        @if (cargando){
            <tr><td colspan="3">Cargando...</td></tr>
        } @else{
            @for (contact of contacts; track contact.id){
            <tr app-contact-row [contact]="contact"></tr>
        }
    }
        
    </tbody>
</table>
